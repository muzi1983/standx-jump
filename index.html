<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07110d">
<title>StandX Jump</title>
<style>
  :root{--green:#13a85b;--green2:#0b6d3d;--lime:#8fe36b;--yellow:#ffd92e;--black:#07110d;--panel:#0b1712}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,470px);height:min(100vh,860px);overflow:hidden;background:#eef7f1}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  .hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;pointer-events:none}
  .stat{flex:1;min-width:0;background:rgba(5,15,11,.94);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 10px;color:white;box-shadow:0 8px 25px #0002}
  .label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#9eafa7}
  .value{font-weight:900;font-size:18px;line-height:1.05;margin-top:2px}
  .value.green{color:#65db87}.value.yellow{color:#ffd92e}
  #pause{position:absolute;right:13px;top:82px;border:0;background:#fff;color:#07110d;width:38px;height:38px;border-radius:50%;font-size:17px;font-weight:900;box-shadow:0 5px 18px #0002;cursor:pointer}
  .brand{position:absolute;left:15px;bottom:14px;color:#07110d;font-weight:950;font-size:14px;display:flex;gap:7px;align-items:center;pointer-events:none}
  .brandMark{width:22px;height:22px;border-radius:4px;background:#07110d;color:white;display:grid;place-items:center;font-weight:900}
  .ticker{position:absolute;left:0;right:0;bottom:0;background:rgba(5,15,11,.96);height:39px;color:#fff;display:flex;justify-content:space-around;align-items:center;font-size:10px;letter-spacing:.02em}
  .ticker b{font-size:11px}.up{color:#6be18c}.down{color:#ff746b}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,7,.38);backdrop-filter:blur(3px);padding:22px}
  .card{width:100%;max-width:390px;background:#f6fbf7;border-radius:26px;padding:27px 24px 22px;text-align:center;box-shadow:0 24px 80px #0007;border:1px solid #fff}
  .logo{font-size:40px;font-weight:1000;letter-spacing:-.06em;line-height:.9;color:#07110d}
  .logo span{color:#13a85b}.tag{margin-top:10px;color:#4d6258;font-weight:700;font-size:13px}
  .mascot{width:175px;height:175px;object-fit:contain;margin:7px auto 2px;filter:drop-shadow(0 18px 10px #07110d22)}
  .play{border:0;border-radius:15px;background:#0b1712;color:#fff;font-size:16px;font-weight:950;padding:15px 30px;width:100%;cursor:pointer;box-shadow:0 9px 0 #073d25}
  .play:active{transform:translateY(4px);box-shadow:0 5px 0 #073d25}
  .hint{font-size:11px;color:#6d7e75;margin-top:15px;line-height:1.55}
  .smallrow{display:flex;gap:8px;margin-top:12px}.mini{flex:1;border:1px solid #d8e4dc;background:white;border-radius:12px;padding:10px;font-size:10px;color:#52655c}.mini b{display:block;color:#07110d;font-size:13px}
  #gameover .card{background:#07110d;color:white;border-color:#173127}
  #gameover .logo{color:#fff}.overTitle{font-size:29px;font-weight:1000;margin:3px 0 2px}.liquidated{color:#ff5d4d}.final{font-size:52px;font-weight:1000;color:#ffd92e;letter-spacing:-.05em;margin:4px 0}
  .substats{display:flex;justify-content:space-around;margin:15px 0 20px}.substats div{font-size:10px;color:#8fa097}.substats b{display:block;color:#fff;font-size:15px;margin-top:3px}
  .share{border:1px solid #355446;background:#10241b;color:white;border-radius:14px;padding:13px;width:100%;font-weight:900;cursor:pointer;margin-top:9px}
  .hidden{display:none}
  #pauseOverlay{background:rgba(2,10,7,.62)}
  .pauseText{font-size:34px;font-weight:1000;color:#fff}
  @media(max-height:650px){#wrap{height:100vh}.mascot{width:135px;height:135px}.card{padding:20px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="stat"><div class="label">Score</div><div id="score" class="value">0</div></div>
    <div class="stat"><div class="label">Height</div><div id="height" class="value green">0m</div></div>
    <div class="stat"><div class="label">Multiplier</div><div id="mult" class="value yellow">x1</div></div>
  </div>

  <button id="pause" aria-label="Pause">Ⅱ</button>

  <div id="start" class="overlay">
    <div class="card">
      <div class="logo">STAND<span>X</span><br><span>JUMP</span></div>
      <div class="tag">JUMP HIGHER. TRADE SMARTER.</div>
      <img id="startMascot" class="mascot" alt="StandX mascot">
      <button id="startBtn" class="play">TAP TO START</button>
      <div class="smallrow">
        <div class="mini"><b>← →</b>Move</div>
        <div class="mini"><b>●</b>Auto Jump</div>
        <div class="mini"><b>✦</b>Collect</div>
      </div>
      <div class="hint">Desktop: A/D or ←/→ &nbsp; • &nbsp; Mobile: touch left/right</div>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="card">
      <div class="overTitle">GAME OVER</div>
      <div id="overReason" class="liquidated">POSITION LIQUIDATED</div>
      <img id="overMascot" class="mascot" alt="StandX mascot">
      <div class="label">FINAL SCORE</div>
      <div id="finalScore" class="final">0</div>
      <div class="substats">
        <div>HEIGHT<b id="finalHeight">0m</b></div>
        <div>MULTIPLIER<b id="finalMult">x1</b></div>
        <div>BEST<b id="bestScore">0</b></div>
      </div>
      <button id="againBtn" class="play">PLAY AGAIN</button>
      <button id="shareBtn" class="share">𝕏 SHARE YOUR SCORE</button>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay hidden"><div class="pauseText">PAUSED</div></div>

  <div class="brand"><span class="brandMark">S</span> StandX Jump</div>
  <div class="ticker">
    <span>BTC <b>118,420</b> <i class="up">▲2.35%</i></span>
    <span>ETH <b>4,820</b> <i class="up">▲1.81%</i></span>
    <span>XAU <b>3,480</b> <i class="down">▼0.42%</i></span>
  </div>
</div>

document.getElementById('startMascot').src=MASCOT_DATA;
document.getElementById('overMascot').src=MASCOT_DATA;

const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const W=420, H=760;
let dpr=Math.min(devicePixelRatio||1,2);
canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);

const mascot=new Image(); mascot.src=MASCOT_DATA;
let running=false, paused=false, last=0, raf=0;
let player, platforms=[], items=[], particles=[], cameraY=0, worldTop=0;
let score=0,height=0,mult=1,combo=0,level=0,best=Number(localStorage.getItem('standxJumpBest')||0);
let keys={left:false,right:false};

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function reset(){
  score=0;height=0;mult=1;combo=0;level=0;cameraY=0;worldTop=0;items=[];particles=[];
  player={x:W/2-23,y:H-135,w:46,h:46,vx:0,vy:0,grounded:false,rot:0};
  platforms=[];
  // Starting platform and a forgiving first sequence.
  platforms.push({x:W/2-70,y:H-72,w:140,h:14,type:'normal',baseX:W/2-70,phase:0,used:false});
  let y=H-150;
  for(let i=0;i<22;i++){ addPlatform(y,i); y-=rand(62,88); }
  updateHUD();
}
function addPlatform(y,i){
  const gap=Math.min(145,85+i*2.1);
  const x=clamp(rand(18,W-118),18,W-118);
  const r=Math.random();
  let type=r<.66?'normal':r<.78?'long':r<.89?'moving':r<.96?'disappear':'boost';
  platforms.push({x,y,w:rand(74,112),h:13,type,baseX:x,phase:Math.random()*6.28,used:false});
  if(Math.random()<.20) items.push({x:x+rand(12,70),y:y-26,type:Math.random()<.55?'coin':Math.random()<.75?'flower':'multi',r:11,got:false});
}
function ensurePlatforms(){
  let top=Math.min(...platforms.map(p=>p.y));
  while(top>cameraY-650){ top-=rand(62,90); addPlatform(top,Math.round(height/100)); }
  platforms=platforms.filter(p=>p.y<cameraY+H+140);
  items=items.filter(i=>i.y<cameraY+H+100 && !i.got);
}
function worldTheme(){
  if(height<1000) return 'garden';
  if(height<5000) return 'city';
  return 'space';
}
function platformColor(p){
  if(p.type==='long') return '#19a85b';
  if(p.type==='boost') return '#ffd92e';
  if(p.type==='moving') return '#9fe46d';
  if(p.type==='disappear') return '#64766d';
  return '#111a16';
}
function drawBackground(){
  const theme=worldTheme();
  if(theme==='garden'){
    ctx.fillStyle='#eef7f1';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#d8e9df';ctx.lineWidth=1;
    for(let y=60-(cameraY%100);y<H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.fillStyle='#dff0e5'; for(let i=0;i<8;i++){let x=(i*73+30)%W;let y=(i*111+cameraY*.12)%H;ctx.beginPath();ctx.arc(x,y,35,0,Math.PI*2);ctx.fill()}
  }else if(theme==='city'){
    ctx.fillStyle='#10241b';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#173c2a';
    for(let i=0;i<12;i++){let x=i*42-10;let bh=100+(i%5)*65;ctx.fillRect(x,H-40-bh,32,bh)}
    ctx.strokeStyle='#1c8d50';ctx.globalAlpha=.32;
    for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(i*95,H);ctx.lineTo(i*95+170,H-300-(i*20));ctx.stroke()}
    ctx.globalAlpha=1;
    ctx.fillStyle='#65db87';ctx.font='bold 10px monospace';ctx.fillText('BTC ▲',18,145);ctx.fillText('ETH ▲',330,230)
  }else{
    ctx.fillStyle='#050914';ctx.fillRect(0,0,W,H);
    for(let i=0;i<55;i++){let x=(i*83)%W,y=(i*137+cameraY*.18)%H;ctx.fillStyle=i%4?'#ffffff66':'#65db87';ctx.fillRect(x,y,1.5,1.5)}
    ctx.strokeStyle='#243b5a';ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(320,190,70,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(320,190,94,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1
    ctx.fillStyle='#183047';ctx.beginPath();ctx.arc(320,190,42,0,Math.PI*2);ctx.fill()
  }
}
function drawPlatform(p){
  const sy=p.y-cameraY;
  if(sy<-30||sy>H+30)return;
  let x=p.x;
  if(p.type==='moving') x=p.baseX+Math.sin(p.phase+performance.now()/650)*55;
  p.renderX=x;
  ctx.fillStyle=platformColor(p);roundRect(x,sy,p.w,p.h,7);ctx.fill();
  ctx.fillStyle=p.type==='boost'?'#111a16':'#ffffff22';roundRect(x+7,sy+3,p.w-14,3,2);ctx.fill();
  if(p.type==='long'||p.type==='boost'){
    ctx.fillStyle=p.type==='boost'?'#111a16':'#d9ffd1';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(p.type==='boost'?'BOOST':'LONG',x+p.w/2,sy+10);ctx.textAlign='left';
  }
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawItem(i){
  const x=i.x,y=i.y-cameraY;if(y<-30||y>H+30)return;
  ctx.save();ctx.translate(x,y);
  if(i.type==='coin'){ctx.fillStyle='#ffd92e';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111a16';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('S',0,4)}
  else if(i.type==='flower'){ctx.fillStyle='#ffd92e';for(let a=0;a<5;a++){ctx.beginPath();ctx.ellipse(Math.cos(a*1.256)*7,Math.sin(a*1.256)*7,5,8,a*1.256,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#13a85b';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill()}
  else{ctx.fillStyle='#8fe36b';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07110d';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('5x',0,3)}
  ctx.restore();
}
function drawPlayer(){
  const sx=player.x,sy=player.y-cameraY;
  ctx.save();ctx.translate(sx+player.w/2,sy+player.h/2);ctx.rotate(player.rot);
  ctx.shadowColor='#0005';ctx.shadowBlur=14;ctx.shadowOffsetY=8;
  ctx.drawImage(mascot,-player.w/2,-player.h/2,player.w,player.h);
  ctx.restore();
}
function burst(x,y,n=10){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-2.5,2.5),vy:rand(-3,-.4),life:1,s:rand(2,5)})
}
function drawParticles(dt){
  for(const p of particles){p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.vy+=.06;p.life-=dt*1.8;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ffd92e';ctx.fillRect(p.x,p.y,p.s,p.s)}
  ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)
}
function update(dt){
  const accel=0.55;
  if(keys.left)player.vx-=accel*dt*60;
  if(keys.right)player.vx+=accel*dt*60;
  player.vx*=Math.pow(.86,dt*60);player.vx=clamp(player.vx,-5.5,5.5);
  const oldY=player.y;
  player.vy+=0.28*dt*60;
  player.x+=player.vx*dt*60;player.y+=player.vy*dt*60;
  if(player.x<-player.w)player.x=W;
  if(player.x>W)player.x=-player.w;
  player.rot=clamp(player.vx*.06,-.25,.25);

  // platform collision while falling
  if(player.vy>0){
    for(const p of platforms){
      const px=p.renderX ?? p.x, py=p.y;
      if(oldY+player.h<=py+5 && player.y+player.h>=py && player.x+player.w>px+4 && player.x<px+p.w-4){
        player.y=py-player.h;player.vy=-(p.type==='boost'?12.8:9.5);
        combo++; if(combo%5===0)mult=Math.min(10,mult+1);
        score+=Math.round((100+(p.type==='boost'?150:0))*mult);
        burst(player.x+player.w/2,py,12);
        if(p.type==='disappear')p.used=true;
        break;
      }
    }
  }
  // camera follows player upward
  const target=player.y-H*.42;
  if(target<cameraY){let dy=cameraY-target;cameraY-=dy*.10; height=Math.max(height,Math.floor((H-130-cameraY)/1.05))}
  // items
  for(const i of items){
    if(i.got)continue;
    const ix=i.x,iy=i.y;
    if(player.x<ix+14&&player.x+player.w>ix-14&&player.y<iy+14&&player.y+player.h>iy-14){
      i.got=true;
      if(i.type==='coin')score+=50*mult;
      if(i.type==='flower')score+=500*mult;
      if(i.type==='multi')mult=Math.min(10,mult+2);
      burst(ix,iy,16);
    }
  }
  ensurePlatforms();
  platforms=platforms.filter(p=>!p.used);
  if(player.y-cameraY>H+70) endGame();
  updateHUD();
}
function updateHUD(){
  document.getElementById('score').textContent=Math.floor(score).toLocaleString();
  document.getElementById('height').textContent=Math.max(0,Math.floor(height)).toLocaleString()+'m';
  document.getElementById('mult').textContent='x'+mult;
}
function loop(t){
  if(!running||paused)return;
  const dt=Math.min(.033,(t-last)/1000||.016);last=t;
  ctx.clearRect(0,0,W,H);drawBackground();
  for(const p of platforms)drawPlatform(p);
  for(const i of items)drawItem(i);
  update(dt);drawPlayer();drawParticles(dt);
  raf=requestAnimationFrame(loop);
}
function start(){
  reset();running=true;paused=false;
  document.getElementById('start').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');document.getElementById('pauseOverlay').classList.add('hidden');
  last=performance.now();raf=requestAnimationFrame(loop);
}
function endGame(){
  if(!running)return;
  running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('standxJumpBest',best);
  document.getElementById('finalScore').textContent=Math.floor(score).toLocaleString();
  document.getElementById('finalHeight').textContent=Math.max(0,Math.floor(height)).toLocaleString()+'m';
  document.getElementById('finalMult').textContent='x'+mult;
  document.getElementById('bestScore').textContent=best.toLocaleString();
  document.getElementById('gameover').classList.remove('hidden');
}
function togglePause(){
  if(!running)return;
  paused=!paused;
  document.getElementById('pauseOverlay').classList.toggle('hidden',!paused);
  if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}
}
document.getElementById('startBtn').onclick=start;
document.getElementById('againBtn').onclick=start;
document.getElementById('pause').onclick=togglePause;
document.getElementById('shareBtn').onclick=async()=>{
  const text=`🐾 I just reached ${Math.floor(score).toLocaleString()} in StandX Jump!\\nHow high can you go?\\n\\n#StandX #StandXJump`;
  try{if(navigator.share)await navigator.share({title:'StandX Jump',text});else{await navigator.clipboard.writeText(text);alert('Score copied!')}}
  catch(e){}
};
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
  if(e.key===' '){if(!running)start();else togglePause()}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
});
canvas.addEventListener('pointerdown',e=>{
  if(!running)return;
  const r=canvas.getBoundingClientRect(),x=e.clientX-r.left;
  if(x<r.width/2)keys.left=true;else keys.right=true;
});
canvas.addEventListener('pointerup',()=>{keys.left=false;keys.right=false});
canvas.addEventListener('pointercancel',()=>{keys.left=false;keys.right=false});
canvas.addEventListener('pointerleave',()=>{keys.left=false;keys.right=false});

// Initial background preview
reset();ctx.clearRect(0,0,W,H);drawBackground();for(const p of platforms)drawPlatform(p);drawPlayer();
</script>
